[colors]
background = #1a1a2e
foreground = #e0e0e0
accent     = #ffcc00
muted      = #888899
alert      = #cc4444
good       = #44cc66

[bar/main]
width        = 100%
height       = 26
offset-x     = 0
offset-y     = 0
radius       = 0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

font-0 = "JetBrains Mono:size=10:weight=regular;2"
font-1 = "JetBrains Mono:size=10:weight=bold;2"
font-2 = "JetBrainsMono Nerd Font:size=12;3"

modules-left   = cpu memory fs
modules-center =
modules-right  = tray network pulseaudio battery date

padding-left  = 2
padding-right = 2
module-margin = 1

; override-redirect = true skips _NET_WM_STRUT so StumpWM geometry is untouched
override-redirect = true
wm-restack        = generic

[module/cpu]
type             = internal/cpu
interval         = 3
format           = %{A1:kitty -e htop &:}<label>%{A}
label            = "%{T3}%{T-} %percentage%%"
label-foreground = ${colors.muted}
warn-percentage  = 80
label-warn             = "%{T3}%{T-} %percentage%%"
label-warn-foreground  = ${colors.alert}

[module/memory]
type     = internal/memory
interval = 5
format   = %{A1:kitty -e htop &:}<label>%{A}
label    = "%{T3}󰚋%{T-} %gb_used%"
label-foreground = ${colors.muted}

[module/fs]
type             = internal/fs
mount-0          = /
interval         = 30
format-mounted   = %{A1:kitty -e ncdu / &:}<label-mounted>%{A}
label-mounted    = "%{T3}󰋊%{T-} %percentage_used%%"
label-mounted-foreground = ${colors.muted}

[module/network]
type                = internal/network
interface-type      = wired
interval            = 5
format-connected    = %{A1:kitty -e nmtui &:}<label-connected>%{A}
format-disconnected = %{A1:kitty -e nmtui &:}<label-disconnected>%{A}
label-connected            = "%{T3}󰈁%{T-} %ifname%"
label-connected-foreground = ${colors.accent}
label-disconnected         = "%{T3}󰈂%{T-} --"
label-disconnected-foreground = ${colors.muted}

[module/pulseaudio]
type          = internal/pulseaudio
use-ui-max    = false
interval      = 5
format-volume = %{A1:kitty -e pulsemixer &:}%{A3:pamixer --toggle-mute:}%{A4:pamixer --increase 5:}%{A5:pamixer --decrease 5:}<label-volume>%{A}%{A}%{A}%{A}
format-muted  = %{A1:kitty -e pulsemixer &:}%{A3:pamixer --toggle-mute:}%{A4:pamixer --increase 5:}%{A5:pamixer --decrease 5:}<label-muted>%{A}%{A}%{A}%{A}
label-volume           = "%{T3}󰕾%{T-} %percentage%%"
label-volume-foreground = ${colors.foreground}
label-muted            = "%{T3}󰖁%{T-} muted"
label-muted-foreground  = ${colors.muted}

[module/tray]
type            = internal/tray
format          = <tray>
tray-spacing    = 6
tray-padding    = 4
tray-background = ${colors.background}
tray-size       = 60%

[module/battery]
type                = internal/battery
battery             = BAT0
adapter             = AC
full-at             = 100
interval            = 30
format-charging     = <label-charging>
format-discharging  = <label-discharging>
format-full         = <label-full>
label-charging           = "%{T3}󰂄%{T-} %percentage%%"
label-charging-foreground = ${colors.accent}
label-discharging           = "%{T3}󰁹%{T-} %percentage%%"
label-discharging-foreground = ${colors.alert}
label-full           = "%{T3}󰂄%{T-} full"
label-full-foreground = ${colors.good}

[module/date]
type             = custom/script
exec             = /home/vxe/.config/polybar/date-display.sh
interval         = 1
format           = %{A1:echo '(pick-date-city)' > /tmp/stumpwm-eval-input:}<label>%{A}
label-foreground = ${colors.foreground}
