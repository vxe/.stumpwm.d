[colors]
background = #1a1a2e
foreground = #e0e0e0
accent     = #6666cc
muted      = #888899
alert      = #cc4444
dropbox    = #0061FF

[bar/main]
width        = 100%
height       = 26
offset-x     = 0
offset-y     = 0
radius       = 0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

font-0 = "JetBrains Mono:size=10:weight=regular;2"
font-1 = "JetBrains Mono:size=10:weight=bold;2"

modules-left   = cpu memory
modules-center =
modules-right  = dropbox network pulseaudio battery date

padding-left  = 2
padding-right = 2
module-margin = 1

tray-position = right
tray-padding  = 4

; override-redirect = true skips _NET_WM_STRUT so StumpWM geometry is untouched
override-redirect = true
wm-restack        = generic

[module/cpu]
type             = internal/cpu
interval         = 3
format           = <label>
label            = "CPU %percentage%%"
label-foreground = ${colors.muted}
warn-percentage  = 80
label-warn             = "CPU %percentage%%"
label-warn-foreground  = ${colors.alert}

[module/memory]
type     = internal/memory
interval = 5
format   = <label>
label    = "MEM %gb_used%"
label-foreground = ${colors.muted}

[module/network]
type                = internal/network
interface-type      = wired
interval            = 5
format-connected    = <label-connected>
format-disconnected = <label-disconnected>
label-connected            = "NET %ifname%"
label-connected-foreground = ${colors.accent}
label-disconnected         = "NET --"
label-disconnected-foreground = ${colors.muted}

[module/pulseaudio]
type          = internal/pulseaudio
use-ui-max    = false
interval      = 5
format-volume = <label-volume>
format-muted  = <label-muted>
label-volume           = "VOL %percentage%%"
label-volume-foreground = ${colors.foreground}
label-muted            = "MUTE"
label-muted-foreground  = ${colors.muted}

[module/dropbox]
type             = custom/script
exec             = /home/vxe/.config/polybar/dropbox-status.sh
interval         = 10
format           = <label>
label-foreground = ${colors.dropbox}

[module/battery]
type                = internal/battery
battery             = BAT0
adapter             = AC
full-at             = 98
interval            = 30
format-charging     = <label-charging>
format-discharging  = <label-discharging>
format-full         = <label-full>
label-charging           = "BAT %percentage%%+"
label-charging-foreground = ${colors.accent}
label-discharging           = "BAT %percentage%%"
label-discharging-foreground = ${colors.foreground}
label-full           = "BAT full"
label-full-foreground = ${colors.muted}

[module/date]
type     = internal/date
interval = 30
date     = "%a %b %d"
time     = "%H:%M"
label    = "%date%  %time%"
label-foreground = ${colors.foreground}
