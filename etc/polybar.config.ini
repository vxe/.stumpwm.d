; Polybar config for StumpWM
; Matches StumpWM mode-line style

[colors]
background = #222
foreground = #eee
alert = #ff0000
good = #00ff00

[bar/stumpwm]
width = 100%
height = 28
background = ${colors.background}
foreground = ${colors.foreground}

; Fonts
font-0 = "monospace:size=10;2"
font-1 = "Font Awesome 6 Free:style=Solid:size=10;2"
font-2 = "Font Awesome 6 Brands:size=10;2"

; Modules
modules-left = date
modules-center =
modules-right = cpu memory battery tray

; Padding
padding-left = 1
padding-right = 1
module-margin = 1

[module/date]
type = internal/date
interval = 5

date = %Y-%m-%d
time = %H:%M

label = %date% %time%

[module/cpu]
type = internal/cpu
interval = 2
label = CPU %percentage%%

[module/memory]
type = internal/memory
interval = 2
label = RAM %percentage_used%%

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98

label-charging = CHG %percentage%%
label-discharging = BAT %percentage%%
label-full = FULL

format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>

[module/tray]
type = internal/tray

tray-spacing = 4px
tray-padding = 2px
